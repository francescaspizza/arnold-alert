name: Arnold Alert

on:
  # Started by cron-job.org (job "Arnold Alert") at :00 :15 :30 :45 from 11am and 3pm Adelaide.
  # GitHub's own schedule was removed on 8 Oct 2026: it only ran ~4 times a day.
  # Do not delete the cron-job.org job, it is the only trigger.
  workflow_dispatch:

jobs:
  arnold-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore processed emails cache
        uses: actions/cache@v4
        with:
          path: .processed_emails.json
          key: arnold-processed-${{ github.run_id }}
          restore-keys: |
            arnold-processed-

      - name: Restore last script cache
        uses: actions/cache@v4
        with:
          path: .last_script
          key: arnold-last-script-${{ github.run_id }}
          restore-keys: |
            arnold-last-script-

      - name: Install dependencies
        run: pip install requests

      - name: Run Arnold Alert
        env:
          GMAIL_ADDRESS:        ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          ELEVENLABS_API_KEY:   ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID:  ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_FALLBACK: ${{ secrets.ELEVENLABS_VOICE_ID_FALLBACK }}
          TWILIO_ACCOUNT_SID:   ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:    ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER:  ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: python arnold_alert.py
