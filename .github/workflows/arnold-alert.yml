name: Arnold Alert

on:
  schedule:
    # All times in UTC. Adelaide is UTC+9:30 (ACST, Apr–Oct) or UTC+10:30 (ACDT, Oct–Apr)
    # Target: 11:30am–10pm Adelaide time, every 15 min, year-round.
    # ACST:  11:30am = 02:00 UTC
    # ACDT:  11:30am = 01:00 UTC
    # Window covers both: 01:00–12:00 UTC. arnold_alert.py checks Adelaide time itself.
    - cron: '*/15 1 * * *'     # 11:30am ACDT start (daylight saving)
    - cron: '*/15 2-11 * * *'  # every 15 min through the main window
    - cron: '0 12 * * *'       # 9:30pm ACST / 10:30pm ACDT tail
  workflow_dispatch:           # Allow manual trigger from GitHub website

jobs:
  arnold-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore processed emails cache
        uses: actions/cache@v4
        with:
          path: .processed_emails.json
          key: arnold-processed-${{ github.run_id }}
          restore-keys: |
            arnold-processed-

      - name: Restore last script cache
        uses: actions/cache@v4
        with:
          path: .last_script
          key: arnold-last-script-${{ github.run_id }}
          restore-keys: |
            arnold-last-script-

      - name: Install dependencies
        run: pip install requests

      - name: Run Arnold Alert
        env:
          GMAIL_ADDRESS:        ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          ELEVENLABS_API_KEY:   ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID:  ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_FALLBACK: ${{ secrets.ELEVENLABS_VOICE_ID_FALLBACK }}
          TWILIO_ACCOUNT_SID:   ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:    ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER:  ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: python arnold_alert.py
